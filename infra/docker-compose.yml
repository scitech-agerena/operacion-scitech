services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../tableros:/srv/www:ro
      - ../shared:/srv/www/shared:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - oauth2-proxy
      - api

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    restart: unless-stopped
    env_file: .env
    environment:
      OAUTH2_PROXY_PROVIDER: google
      OAUTH2_PROXY_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAIN}
      # Clientes externos: correos individuales autorizados (se permite dominio O lista). Archivo fuera de Git.
      OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE: /etc/oauth2-proxy/external-emails.txt
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REDIRECT_URL: https://${DOMAIN}/oauth2/callback
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_EXPIRE: 8h
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_UPSTREAMS: static://202
    volumes:
      - ./external-emails.txt:/etc/oauth2-proxy/external-emails.txt:ro

  api:
    build: ../api
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
    volumes:
      - ../api/config:/app/config:ro
    # Sin "ports": la API solo es accesible desde Caddy dentro de la red de Docker.

volumes:
  caddy_data:
  caddy_config:
