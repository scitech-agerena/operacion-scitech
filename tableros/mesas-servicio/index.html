<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mesas de servicio · SCITECH</title>
  <link rel="stylesheet" href="/shared/brand.css">
</head>
<body>
  <header class="top">
    <h1>Mesas de servicio</h1>
    <p>Estado de las solicitudes de soporte en tiempo casi real: volumen, resolución y pendientes por proyecto.</p>
  </header>

  <main>
    <div class="controls">
      <label>Proyecto
        <select id="project"></select>
      </label>
      <label>Periodo
        <select id="days">
          <option value="30">Últimos 30 días</option>
          <option value="90" selected>Últimos 90 días</option>
          <option value="180">Últimos 180 días</option>
          <option value="365">Últimos 365 días</option>
        </select>
      </label>
    </div>

    <div id="msg"></div>
    <div id="content" hidden>
      <section class="kpis" id="kpis"></section>
      <section class="grid">
        <div class="card"><h2>Por estado</h2><div id="porEstado"></div></div>
        <div class="card"><h2>Por prioridad</h2><div id="porPrioridad"></div></div>
        <div class="card" id="cardAsignado"><h2>Abiertas por responsable</h2><div id="porAsignado"></div></div>
      </section>
      <section class="card">
        <h2>Creadas vs. resueltas por semana</h2>
        <div id="porSemana"></div>
      </section>
      <section class="card" style="margin-top:12px">
        <h2>Solicitudes abiertas</h2>
        <div class="table-wrap"><table id="abiertas"></table></div>
      </section>
      <p class="note" id="actualizado"></p>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    function el(tag, props = {}, ...children) {
      const node = document.createElement(tag);
      for (const [k, v] of Object.entries(props)) {
        if (k === 'class') node.className = v;
        else if (k === 'style') node.setAttribute('style', v);
        else node[k] = v;
      }
      for (const c of children) node.append(c);
      return node;
    }

    function showMessage(text, isError = true) {
      const box = $('msg');
      box.replaceChildren(text ? el('div', { class: isError ? 'error' : 'note' }, text) : '');
    }

    function bars(container, data) {
      const entries = Object.entries(data || {}).sort((a, b) => b[1] - a[1]);
      const max = Math.max(1, ...entries.map(([, n]) => n));
      container.replaceChildren(...entries.map(([name, n]) =>
        el('div', { class: 'bar-row' },
          el('span', { class: 'name', title: name }, name),
          el('div', { class: 'bar' }, el('span', { style: `width:${(n / max) * 100}%` })),
          el('span', { class: 'n' }, String(n)))));
      if (!entries.length) container.replaceChildren(el('p', { class: 'note' }, 'Sin datos'));
    }

    function kpi(value, label) {
      return el('div', { class: 'card kpi' }, el('div', { class: 'v' }, String(value ?? '—')), el('div', { class: 'l' }, label));
    }

    function weekly(container, weeks) {
      const max = Math.max(1, ...weeks.flatMap((w) => [w.creados, w.resueltos]));
      const rows = weeks.slice(-12).map((w) =>
        el('div', { class: 'bar-row', style: 'grid-template-columns:90px 1fr 70px' },
          el('span', { class: 'name' }, w.semana),
          el('div', {},
            el('div', { class: 'bar', style: 'margin-bottom:3px' }, el('span', { style: `width:${(w.creados / max) * 100}%` })),
            el('div', { class: 'bar' }, el('span', { style: `width:${(w.resueltos / max) * 100}%;background:var(--c-ok)` }))),
          el('span', { class: 'n' }, `${w.creados} / ${w.resueltos}`)));
      container.replaceChildren(...rows, el('p', { class: 'note' }, 'Barra superior: creadas · barra verde: resueltas (últimas 12 semanas, inicio de semana en lunes)'));
    }

    function openTable(table, items, withAssignee) {
      const head = ['Clave', 'Resumen', 'Estado', 'Prioridad', ...(withAssignee ? ['Responsable'] : []), 'Creada'];
      const thead = el('thead', {}, el('tr', {}, ...head.map((h) => el('th', {}, h))));
      const tbody = el('tbody', {}, ...items.map((i) => el('tr', {},
        el('td', {}, el('a', { href: i.url, target: '_blank', rel: 'noopener noreferrer' }, i.key)),
        el('td', {}, i.resumen || ''),
        el('td', {}, i.estado || ''),
        el('td', {}, i.prioridad || ''),
        ...(withAssignee ? [el('td', {}, i.asignado || 'Sin asignar')] : []),
        el('td', {}, (i.creado || '').slice(0, 10)))));
      table.replaceChildren(thead, tbody);
    }

    async function api(path) {
      const res = await fetch(path, { credentials: 'same-origin', headers: { Accept: 'application/json' } });
      if (res.status === 403) throw new Error('No tienes acceso a esta información.');
      if (!res.ok) throw new Error('No se pudo cargar la información. Intenta de nuevo en unos minutos.');
      return res.json();
    }

    async function load() {
      showMessage('Cargando…', false);
      $('content').hidden = true;
      try {
        const data = await api(`/api/mesas?project=${encodeURIComponent($('project').value)}&days=${$('days').value}`);
        const t = data.totales;
        $('kpis').replaceChildren(
          kpi(t.solicitudes, 'Solicitudes'),
          kpi(t.abiertas, 'Abiertas'),
          kpi(t.resueltas, 'Resueltas'),
          kpi(t.tasaResolucion == null ? '—' : `${t.tasaResolucion}%`, 'Tasa de resolución'),
          kpi(data.resolucionHoras.mediana == null ? '—' : `${data.resolucionHoras.mediana} h`, 'Resolución (mediana)'));
        bars($('porEstado'), data.porEstado);
        bars($('porPrioridad'), data.porPrioridad);
        const withAssignee = Boolean(data.abiertasPorAsignado);
        $('cardAsignado').hidden = !withAssignee;
        if (withAssignee) bars($('porAsignado'), data.abiertasPorAsignado);
        weekly($('porSemana'), data.porSemana);
        openTable($('abiertas'), data.abiertas, withAssignee);
        $('actualizado').textContent = `Actualizado: ${new Date(data.actualizado).toLocaleString('es-CO')}` +
          (data.truncado ? ' · Resultado limitado a 2000 solicitudes; reduce el periodo.' : '');
        showMessage('');
        $('content').hidden = false;
      } catch (err) {
        showMessage(err.message);
      }
    }

    async function init() {
      try {
        const me = await api('/api/me');
        const mesas = me.proyectos.filter((p) => p.tipo === 'mesa-servicio');
        if (!mesas.length) return showMessage('No tienes proyectos asignados en este tablero.');
        $('project').replaceChildren(...mesas.map((p) => el('option', { value: p.id }, p.nombre)));
        $('project').addEventListener('change', load);
        $('days').addEventListener('change', load);
        load();
      } catch (err) {
        showMessage(err.message);
      }
    }

    init();
  </script>
</body>
</html>
